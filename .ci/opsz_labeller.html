<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opsz labeller</title>
<style>
  :root { --blue:#2563EB; --green:#16A34A; --yellow:#EAB308; --red:#DC2626; --grey:#6B7280; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; background: #F5F5F5; color: #111; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #E5E7EB; padding: 10px 16px; }
  header h1 { margin: 0 0 6px; font-size: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .row label { color: var(--grey); }
  .row input[type=search], .row select { font: inherit; padding: 4px 8px; border: 1px solid #D1D5DB; border-radius: 4px; }
  .row input[type=search] { width: 220px; }
  .row button { font: inherit; padding: 4px 10px; border: 1px solid #D1D5DB; background: #fff; border-radius: 4px; cursor: pointer; }
  .row button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .counter { color: var(--grey); margin-left: auto; }
  .counter b { color: #111; font-variant-numeric: tabular-nums; }
  main { padding: 12px 16px 200px; max-width: 1100px; margin: 0 auto; }

  .card { background: #fff; border-radius: 6px; padding: 12px 16px; margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); border: 2px solid transparent; }
  .card.focused { border-color: var(--blue); }
  .card.lab-Text     { background: #EFF6FF; }
  .card.lab-Display  { background: #FEF3C7; }
  .card[class*="lab-Display\\+"], .card.lab-DisplayPlus { background: #FEE2E2; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--grey); margin-bottom: 6px; }
  .meta .name { font-weight: 600; color: #111; font-size: 14px; }
  .meta .cat { font-family: ui-monospace, monospace; }
  .samples { color: #111; }
  .sample { line-height: 1.3; margin: 8px 0; max-width: 60ch; }
  .s8  { font-size: 8pt; }
  .s24 { font-size: 24pt; }
  .s48 { font-size: 48pt; }
  .radios { margin-top: 10px; display: flex; gap: 6px; }
  .radios label { cursor: pointer; padding: 4px 10px; border: 1px solid #D1D5DB; border-radius: 4px; font-size: 13px; background: #fff; user-select: none; }
  .radios input { display: none; }
  .radios input:checked + span { font-weight: 600; }
  .radios label.t-Text     input:checked ~ span { color: var(--blue); }
  .radios label.t-Display  input:checked ~ span { color: var(--yellow); }
  .radios label.t-DisplayPlus input:checked ~ span { color: var(--red); }
  .radios label:has(input:checked) { background: #F3F4F6; }

  .hint { font-size: 12px; color: var(--grey); margin-left: 12px; }
  kbd { font-family: ui-monospace, monospace; background: #F3F4F6; border: 1px solid #D1D5DB; border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>opsz labeller — 3-bucket (Text / Display / Display+)</h1>
  <div class="row">
    <label>Show
      <select id="filter-status">
        <option value="all">all</option>
        <option value="unlabelled" selected>unlabelled only</option>
        <option value="labelled">labelled only</option>
        <option value="vf-extremes">VF extremes (all)</option>
        <option value="vf-unlabelled">VF extremes (unlabelled)</option>
        <option value="Text">label = Text</option>
        <option value="Display">label = Display</option>
        <option value="Display+">label = Display+</option>
      </select>
    </label>
    <label>Category
      <select id="filter-cat">
        <option value="ALL">ALL</option>
        <option value="DISPLAY">DISPLAY</option>
        <option value="HANDWRITING">HANDWRITING</option>
        <option value="SERIF">SERIF</option>
        <option value="SANS_SERIF">SANS_SERIF</option>
        <option value="MONOSPACE">MONOSPACE</option>
      </select>
    </label>
    <input id="search" type="search" placeholder="search by name...">
    <button id="export" class="primary">Export JSON</button>
    <button id="copy-csv">Copy CSV</button>
    <span class="hint"><kbd>t</kbd>/<kbd>d</kbd>/<kbd>p</kbd> label · <kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>n</kbd> next unlabelled</span>
    <span class="counter">
      labelled <b id="c-lab">0</b> / <b id="c-tot">0</b>
      · T <b id="c-T">0</b> · D <b id="c-D">0</b> · D+ <b id="c-Dp">0</b>
      · families <b id="c-fam">0</b>/<b id="c-fam-tot">0</b>
      · VF extremes <b id="c-vfe">0</b>/<b id="c-vfe-tot">0</b>
    </span>
  </div>
</header>

<main id="list"></main>

<script>
const SAMPLE_8  = "Body text sits at the heart of any page. At small sizes a typeface must hold its own: counters stay open, stroke contrast stays readable, and spacing keeps the rhythm steady. If letters start to clog or dazzle here, the face belongs somewhere larger. Judge this paragraph the way a reader would — scanning, not staring. 0123456789 &amp; fi fl";
const SAMPLE_24 = "Subheadings guide the eye between sections. At this size, personality starts to show — quirky terminals, unusual proportions, stylistic flourishes all become visible without overwhelming the reader.";
const SAMPLE_48 = "Display text commands attention. Details that vanish at small sizes — ink traps, hairline strokes, decorative swashes — can finally sing.";
const state = {
  entries: [],           // full index
  labels: {},            // id -> bucket
  focused: null,         // id of currently focused card
  filter: { status: "unlabelled", cat: "ALL", q: "" },
  loadedFonts: new Set(),
  vfFamilies: new Set(), // dirs that have VF extreme entries
};

function safeFamily(dir) { return "F_" + dir.replace(/[^a-zA-Z0-9]/g, "_"); }

function loadFontFor(entry) {
  if (state.loadedFonts.has(entry.dir)) return;
  state.loadedFonts.add(entry.dir);
  // Encode path components so brackets in VF filenames (e.g. Roboto[wdth,wght].ttf)
  // don't trip strict URL parsers in @font-face src.
  const url = entry.file.split("/").map(encodeURIComponent).join("/").replace(/%2F/g, "/");
  const style = document.createElement("style");
  style.textContent =
    `@font-face { font-family: '${safeFamily(entry.dir)}'; ` +
    `src: url('${url}') format('truetype-variations'), ` +
    `url('${url}') format('truetype'); ` +
    `font-display: block; }`;
  document.head.appendChild(style);
}

function entryId(e) { return e.id || e.dir; }

const QUANT_CSV_URL = "https://raw.githubusercontent.com/google/fonts/main/tags/all/quant.csv";
const REVERSE_BOUNDS = { "5,24": "Text", "24,48": "Display", "48,300": "Display+" };

function parseCSVLine(line) {
  const fields = [];
  let cur = "", q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; continue; }
    if (ch === ',' && !q) { fields.push(cur); cur = ""; continue; }
    cur += ch;
  }
  fields.push(cur);
  return fields;
}

async function loadQuantCSV() {
  let resp;
  try { resp = await fetch(QUANT_CSV_URL); } catch { return; }
  if (!resp.ok) return;
  const text = await resp.text();
  const pairs = {};
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const [name, loc, tag, value] = parseCSVLine(line);
    if (tag !== "/quant/opsz_min" && tag !== "/quant/opsz_max") continue;
    const key = `${name}|${loc}`;
    const p = pairs[key] = pairs[key] || {};
    if (tag === "/quant/opsz_min") p.min = parseInt(value);
    else p.max = parseInt(value);
  }
  const csvBuckets = {};
  for (const [key, p] of Object.entries(pairs)) {
    if (p.min != null && p.max != null) {
      const bucket = REVERSE_BOUNDS[`${p.min},${p.max}`];
      if (bucket) csvBuckets[key] = bucket;
    }
  }
  let loaded = 0;
  for (const e of state.entries) {
    const loc = formatLocation(e.location);
    const key = `${e.name}|${loc}`;
    if (csvBuckets[key]) { state.labels[entryId(e)] = csvBuckets[key]; loaded++; }
  }
  if (loaded) console.log(`Loaded ${loaded} labels from quant.csv`);
}

function bucketClass(b) { return b ? "lab-" + b.replace("+", "Plus") : ""; }

function fvsStyle(loc) {
  if (!loc) return "";
  return "font-variation-settings: " +
    Object.entries(loc).map(([k,v]) => `'${k}' ${v}`).join(", ") + ";";
}

function locationLabel(loc) {
  if (!loc) return "";
  return " @ " + Object.entries(loc).map(([k,v]) => `${k}=${Number.isInteger(v)?v:v.toFixed(1)}`).join(", ");
}

function makeCard(entry) {
  const fam = safeFamily(entry.dir);
  const eid = entryId(entry);
  const card = document.createElement("div");
  card.className = "card " + bucketClass(state.labels[eid]);
  card.dataset.id = eid;
  card.dataset.dir = entry.dir;
  card.dataset.cat = entry.category;
  card.dataset.name = entry.name.toLowerCase();
  if (entry.location) card.dataset.vfExtreme = "1";
  const displayName = entry.name + locationLabel(entry.location);
  const radioName = CSS.escape(eid);
  card.innerHTML =
    `<div class="meta">
       <span class="name">${displayName}</span>
       <span class="cat">${entry.category} · ${entry.dir}</span>
     </div>
     <div class="samples" style="font-family: '${fam}', system-ui; ${fvsStyle(entry.location)}">
       <div class="sample s8">${SAMPLE_8}</div>
       <div class="sample s24">${SAMPLE_24}</div>
       <div class="sample s48">${SAMPLE_48}</div>
     </div>
     <div class="radios">
       <label class="t-Text"><input type="radio" name="b_${radioName}" value="Text"><span>Text</span></label>
       <label class="t-Display"><input type="radio" name="b_${radioName}" value="Display"><span>Display</span></label>
       <label class="t-DisplayPlus"><input type="radio" name="b_${radioName}" value="Display+"><span>Display+</span></label>
     </div>`;
  const cur = state.labels[eid];
  if (cur) {
    const inp = card.querySelector(`input[value="${cur}"]`);
    if (inp) inp.checked = true;
  }
  card.querySelectorAll("input[type=radio]").forEach(inp => {
    inp.addEventListener("change", () => setLabel(eid, inp.value));
  });
  card.addEventListener("click", () => focusCard(eid));
  return card;
}

function setLabel(id, bucket) {
  state.labels[id] = bucket;
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) {
    card.classList.remove("lab-Text","lab-Display","lab-DisplayPlus");
    card.classList.add(bucketClass(bucket));
    const inp = card.querySelector(`input[value="${bucket}"]`);
    if (inp) inp.checked = true;
  }
  updateCounters();
  applyFilter();
}

function focusCard(id) {
  state.focused = id;
  document.querySelectorAll(".card.focused").forEach(c => c.classList.remove("focused"));
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) card.classList.add("focused");
}

function nextVisibleCard(currentId, direction) {
  const cards = [...document.querySelectorAll(".card")].filter(c => c.style.display !== "none");
  if (cards.length === 0) return null;
  if (!currentId) return cards[0].dataset.id;
  const idx = cards.findIndex(c => c.dataset.id === currentId);
  if (idx < 0) return cards[0].dataset.id;
  const next = cards[idx + direction];
  return next ? next.dataset.id : null;
}

function applyFilter() {
  const { status, cat, q } = state.filter;
  document.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    const lab = state.labels[id];
    let show = true;
    if (status === "unlabelled") {
      show = !lab;
      if (show && !card.dataset.vfExtreme && state.vfFamilies.has(card.dataset.dir)) show = false;
    }
    else if (status === "labelled") show = !!lab;
    else if (status === "vf-extremes") show = !!card.dataset.vfExtreme;
    else if (status === "vf-unlabelled") show = !!card.dataset.vfExtreme && !lab;
    else if (status === "Text" || status === "Display" || status === "Display+") show = lab === status;
    if (show && cat !== "ALL") show = card.dataset.cat === cat;
    if (show && q) show = card.dataset.name.includes(q);
    card.style.display = show ? "" : "none";
  });
}

function updateCounters() {
  const t = Object.values(state.labels).filter(v => v === "Text").length;
  const d = Object.values(state.labels).filter(v => v === "Display").length;
  const dp = Object.values(state.labels).filter(v => v === "Display+").length;
  document.getElementById("c-lab").textContent = t + d + dp;
  document.getElementById("c-tot").textContent = state.entries.length;
  document.getElementById("c-T").textContent = t;
  document.getElementById("c-D").textContent = d;
  document.getElementById("c-Dp").textContent = dp;

  const allFamilies = new Set(state.entries.map(e => e.dir));
  const taggedFamilies = new Set(state.entries.filter(e => state.labels[entryId(e)]).map(e => e.dir));
  document.getElementById("c-fam").textContent = taggedFamilies.size;
  document.getElementById("c-fam-tot").textContent = allFamilies.size;

  const vfExtremes = state.entries.filter(e => e.location);
  const vfTagged = vfExtremes.filter(e => state.labels[entryId(e)]);
  document.getElementById("c-vfe").textContent = vfTagged.length;
  document.getElementById("c-vfe-tot").textContent = vfExtremes.length;
}

const BUCKET_BOUNDS = { "Text": [5, 24], "Display": [24, 48], "Display+": [48, 300] };

function formatLocation(loc) {
  if (!loc) return "";
  const axes = Object.keys(loc).sort();
  return axes.join(",") + "@" + axes.map(a => {
    const v = loc[a]; return Number.isInteger(v) ? v : v.toFixed(1);
  }).join(",");
}

function csvEscape(field) {
  return field.includes(",") ? `"${field}"` : field;
}

async function copyCSV() {
  const btn = document.getElementById("copy-csv");
  btn.textContent = "Loading...";

  // Fetch existing CSV, preserving original order
  let existingLines = [];
  try {
    const resp = await fetch(QUANT_CSV_URL);
    if (resp.ok) {
      const text = await resp.text();
      existingLines = text.split("\n").filter(l => l.trim());
    }
  } catch { /* proceed with labels only */ }

  // Build new opsz rows keyed by "name|loc"
  const newOpsz = new Map();
  state.entries
    .filter(e => state.labels[entryId(e)])
    .forEach(e => {
      const bucket = state.labels[entryId(e)];
      const [ptMin, ptMax] = BUCKET_BOUNDS[bucket];
      const loc = csvEscape(formatLocation(e.location));
      const key = `${e.name}|${loc}`;
      newOpsz.set(key, [
        `${e.name},${loc},/quant/opsz_min,${ptMin}`,
        `${e.name},${loc},/quant/opsz_max,${ptMax}`,
      ]);
    });

  // Walk existing lines: keep non-opsz as-is; existing opsz rows are
  // replaced in place, everything else new is appended at the end
  // (the file is unsorted, so mid-file insertion has no meaning)
  const result = [];
  const insertedKeys = new Set();

  for (const line of existingLines) {
    const fields = parseCSVLine(line);
    const fam = fields[0];
    const isOpsz = fields[2] === "/quant/opsz_min" || fields[2] === "/quant/opsz_max";

    if (isOpsz) {
      // Replace: find the matching new opsz entry and insert it once
      const key = `${fam}|${fields[1]}`;
      if (newOpsz.has(key) && !insertedKeys.has(key)) {
        result.push(...newOpsz.get(key));
        insertedKeys.add(key);
      }
      // Drop old opsz line (replaced or removed)
    } else {
      result.push(line);
    }
  }

  // Append all new opsz entries at the end
  for (const [key, lines] of newOpsz) {
    if (!insertedKeys.has(key)) result.push(...lines);
  }

  navigator.clipboard.writeText(result.join("\n") + "\n").then(() => {
    btn.textContent = `Copied ${result.length} lines`;
    setTimeout(() => btn.textContent = "Copy CSV", 2000);
    window.open("https://github.com/google/fonts/blob/main/tags/all/quant.csv", "_blank");
  });
}

function exportJson() {
  const out = state.entries
    .filter(e => state.labels[entryId(e)])
    .map(e => ({ id: entryId(e), dir: e.dir, file: e.file, name: e.name,
                 category: e.category, location: e.location || null,
                 label: state.labels[entryId(e)] }));
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_export.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function init() {
  state.entries = await (await fetch("opsz_labeller_index.json")).json();
  state.entries.forEach(e => { if (e.location) state.vfFamilies.add(e.dir); });
  await loadQuantCSV();

  const list = document.getElementById("list");
  const frag = document.createDocumentFragment();
  state.entries.forEach(e => frag.appendChild(makeCard(e)));
  list.appendChild(frag);

  // lazy-load fonts as cards enter viewport (keyed by dir — one @font-face per font file)
  const io = new IntersectionObserver((entries) => {
    for (const ent of entries) {
      if (ent.isIntersecting) {
        const id = ent.target.dataset.id;
        const entry = state.entries.find(x => entryId(x) === id);
        if (entry) loadFontFor(entry);
      }
    }
  }, { rootMargin: "300px" });
  document.querySelectorAll(".card").forEach(c => io.observe(c));

  // filters
  document.getElementById("filter-status").addEventListener("change", e => {
    state.filter.status = e.target.value; applyFilter();
  });
  document.getElementById("filter-cat").addEventListener("change", e => {
    state.filter.cat = e.target.value; applyFilter();
  });
  document.getElementById("search").addEventListener("input", e => {
    state.filter.q = e.target.value.trim().toLowerCase(); applyFilter();
  });
  document.getElementById("export").addEventListener("click", exportJson);
  document.getElementById("copy-csv").addEventListener("click", copyCSV);

  // keyboard
  document.addEventListener("keydown", (e) => {
    if (["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
    let bucket = null;
    if (e.key === "t" || e.key === "1") bucket = "Text";
    else if (e.key === "d" || e.key === "2") bucket = "Display";
    else if (e.key === "p" || e.key === "3" || e.key === "+") bucket = "Display+";
    if (bucket && state.focused) {
      e.preventDefault();
      setLabel(state.focused, bucket);
      const nextId = nextVisibleCard(state.focused, 1);
      if (nextId) { focusCard(nextId); document.querySelector(`.card[data-id="${CSS.escape(nextId)}"]`).scrollIntoView({ block: "center" }); }
      return;
    }
    if (e.key === "j" || e.key === "ArrowDown") {
      const id = nextVisibleCard(state.focused, 1);
      if (id) { e.preventDefault(); focusCard(id); document.querySelector(`.card[data-id="${CSS.escape(id)}"]`).scrollIntoView({ block: "center" }); }
    } else if (e.key === "k" || e.key === "ArrowUp") {
      const id = nextVisibleCard(state.focused, -1);
      if (id) { e.preventDefault(); focusCard(id); document.querySelector(`.card[data-id="${CSS.escape(id)}"]`).scrollIntoView({ block: "center" }); }
    } else if (e.key === "n") {
      const cards = [...document.querySelectorAll(".card")].filter(c => c.style.display !== "none" && !state.labels[c.dataset.id]);
      const idx = state.focused ? cards.findIndex(c => c.dataset.id === state.focused) : -1;
      const next = cards[idx + 1] || cards[0];
      if (next) { e.preventDefault(); focusCard(next.dataset.id); next.scrollIntoView({ block: "center" }); }
    }
  });

  applyFilter();
  updateCounters();
  const first = nextVisibleCard(null, 1);
  if (first) focusCard(first);
}


init();
</script>
</body>
</html>
