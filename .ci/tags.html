<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Fonts tagger has moved</title>
  <meta http-equiv="refresh" content="0; url=https://googlefonts.github.io/tagger/">
  <link rel="canonical" href="https://googlefonts.github.io/tagger/">
  <script>
    // The tagger now lives in the googlefonts/tagger repository.
    // replace() keeps this page out of the back button history.
    window.location.replace("https://googlefonts.github.io/tagger/");
  </script>
</head>
<body>
  <p>The tagger has moved to
    <a href="https://googlefonts.github.io/tagger/">https://googlefonts.github.io/tagger/</a>.
  </p>
</body>
</html>
