name: "🔀 Gemini Triage Font Submission"

on:
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-triage-font-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

jobs:
  triage:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    outputs:
      available_labels: "${{ steps.get_labels.outputs.available_labels }}"
      available_milestones: "${{ steps.get_labels.outputs.available_milestones }}"
      milestone_map: "${{ steps.get_labels.outputs.milestone_map }}"
      selected_labels: "${{ env.SELECTED_LABELS }}"
      selected_milestone: "${{ env.SELECTED_MILESTONE }}"
      selected_comment: "${{ env.SELECTED_COMMENT }}"
    permissions:
      contents: "read"
      id-token: "write"
      issues: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Copy custom gemini commands"
        run: |
          mkdir -p .gemini/commands
          cp -r .github/commands/* .gemini/commands/
      - name: "Set up Fontspector"
        uses: "fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812" # ratchet:fonttools/setup-fontspector@main
        with:
          version: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Get repository labels"
        id: "get_labels"
        uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd" # ratchet:actions/github-script@v8.0.0
        with:
          script: |-
            const labels = [];
            const milestones = (await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })).data.reduce((acc, x) => (acc[x.title] = x.number, acc), {});
            core.setOutput('milestone_map', Object.entries(milestones).map( ([k,v]) => `${k}=${v}`).join(", "));
            core.setOutput('available_milestones', Object.keys(milestones).join(','));
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }
            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }
            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            return labelNames;

      - name: "Run Gemini font issue analysis"
        id: "gemini_analysis"
        uses: "google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489" # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          AVAILABLE_LABELS: "${{ steps.get_labels.outputs.available_labels }}"
          AVAILABLE_MILESTONES: "${{ steps.get_labels.outputs.available_milestones }}"
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: "${{ github.token }}" # We need to pass the PAT here because the MCP server needs it
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
        with:
          gcp_location: "${{ vars.GOOGLE_CLOUD_LOCATION }}"
          gcp_project_id: "${{ vars.GOOGLE_CLOUD_PROJECT }}"
          gcp_service_account: "${{ vars.SERVICE_ACCOUNT_EMAIL }}"
          gcp_workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}"
          gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION }}"
          gemini_debug: "${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}"
          gemini_model: "${{ vars.GEMINI_MODEL }}"
          workflow_name: "gemini-triage-font"
          github_issue_number: "${{ github.event.issue.number }}"
          settings: |-
            {
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "issue_read",
                    "pull_request_read",
                    "get_file_contents",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: "/gemini-triage-font"

  label:
    runs-on: "ubuntu-latest"
    needs:
      - "triage"
    if: "${{ needs.triage.outputs.selected_labels != '' || needs.triage.outputs.selected_comment != '' }}"
    permissions:
      contents: "read"
      issues: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: "${{ vars.APP_ID }}"
        uses: "actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf"
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-issues: "write" # labels, comments, milestones
          permission-organization-projects: "write" # add issues to the org project board

      - name: "Apply triage results"
        id: "apply_triage"
        env:
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          AVAILABLE_LABELS: "${{ needs.triage.outputs.available_labels }}"
          MILESTONE_MAP: "${{ needs.triage.outputs.milestone_map }}"
          SELECTED_LABELS: "${{ needs.triage.outputs.selected_labels }}"
          SELECTED_MILESTONE: "${{ needs.triage.outputs.selected_milestone }}"
          SELECTED_COMMENT: "${{ needs.triage.outputs.selected_comment }}"
        uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd"
        with:
          github-token: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          script: |-
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',').map(l => l.trim()).sort();
            const selectedLabels = (process.env.SELECTED_LABELS || '').split(',').map(l => l.trim()).filter(l => availableLabels.includes(l)).sort();
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: process.env.ISSUE_NUMBER,
                labels: selectedLabels,
              });
            }

            if (process.env.SELECTED_COMMENT) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: process.env.ISSUE_NUMBER,
                body: process.env.SELECTED_COMMENT,
              });
            }

            core.setOutput('milestone_applied', '');
            const selectedMilestone = (process.env.SELECTED_MILESTONE || '').trim();
            if (selectedMilestone) {
              // MILESTONE_MAP looks like "Title A=12, Title B=34"
              const milestoneMap = (process.env.MILESTONE_MAP || '')
                .split(',')
                .map(m => m.trim())
                .filter(m => m.includes('='))
                .reduce((acc, m) => {
                  const i = m.lastIndexOf('=');
                  acc[m.slice(0, i).trim()] = parseInt(m.slice(i + 1), 10);
                  return acc;
                }, {});
              const milestoneNumber = milestoneMap[selectedMilestone];
              if (milestoneNumber) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: process.env.ISSUE_NUMBER,
                  milestone: milestoneNumber,
                });
                core.setOutput('milestone_applied', selectedMilestone);
              } else {
                core.warning(`Milestone "${selectedMilestone}" not found. Available: ${Object.keys(milestoneMap).join(', ')}`);
              }
            }

      - name: "Add to Google Fonts project"
        if: "${{ steps.apply_triage.outputs.milestone_applied == 'Submissions to review' && vars.SUBMISSIONS_PROJECT_ID != '' && steps.mint_identity_token.outputs.token != '' }}"
        env:
          PROJECT_ID: "${{ vars.SUBMISSIONS_PROJECT_ID }}"
          ISSUE_NODE_ID: "${{ github.event.issue.node_id }}"
        uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd"
        with:
          # Org-level projects are not reachable with GITHUB_TOKEN: this needs
          # the GitHub App token, with organization "Projects: read and write".
          github-token: "${{ steps.mint_identity_token.outputs.token }}"
          script: |-
            await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`,
              { projectId: process.env.PROJECT_ID, contentId: process.env.ISSUE_NODE_ID }
            );
