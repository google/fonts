[package]
name = "google-fonts-axisregistry"
version = "0.5.0"
edition = "2021"
description = "Google Fonts font axis support data"
repository = "https://github.com/googlefonts/axisregistry"
license-file = "LICENSE.txt"

[features]
default = ["fontations"]
fontations = ["dep:skrifa", "dep:write-fonts"]

[dependencies]
bytes = "1.11.1"
gf-metadata = "0.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
write-fonts = { version = "0.52.0", optional = true }
skrifa = { version = "0.46.2", optional = true }
indexmap = "2.7.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[build-dependencies]
glob = "0"
prettyplease = "0.2"
quote = "1.0"
proc-macro2 = "1.0"
syn = "2.0"
itertools = "0.13"
gf-metadata = "0.2.4"
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
